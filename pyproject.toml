[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "NutMEG-astrobiology"
version = "2.0.0b1"
description = "Nutrients, maintenance, energy, and growth: A biogeochemical model for astrobiology"
readme = "README.md"
authors = [
    { name = "Peter Higgins", email = "hapeterbility@gmail.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "uncertainties>=3.2.2",
    "PyYAML",
    "reaktoro>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/pmhiggins/NutMEG"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
