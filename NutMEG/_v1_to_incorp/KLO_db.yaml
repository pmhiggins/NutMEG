    n_ATP: 1.3
  Acceptor: Fe+3
  Donor: Acetate-
  KineticForcing:
    F_A:
      K: 0.00025
      F_ID: Acceptor
      func: Monod
      S: Fe+3
      ref: JinRoden2011
    F_D:
      K: 1.25e-05
