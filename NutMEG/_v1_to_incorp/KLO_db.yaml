Methanogenesis_H2_HCO3_sediment:
  Reactants:
    H2(aq): 1.
    HCO3-: 0.25
    H+: 0.25
  Products:
    Methane(aq): 0.25
    H2O(aq): 0.75
  Acceptor: HCO3-
  Donor: H2(aq)
  Bioenergetics:
    k_max: 1.0e-06
    xi: 0.25
    n_ATP: 0.125
    ref: JinRoden2011
  KineticForcing:
    F_D:
      F_ID: Donor
      func: Monod
      K: 4.7e-06
      S: H2(aq)
      ref: JinRoden2011
    F_A:
      F_ID: Acceptor
      func: Monod
      K: 2.e-3
      S: HCO3-
      ref: Chen2019Frontiers

Methanogenesis_H2_CO2_sediment:
