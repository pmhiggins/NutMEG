Methanogenesis_H2_HCO3_sediment:
  Reactants:
    H2(aq): 1.
    HCO3-: 0.25
    H+: 0.25
  Products:
    Methane(aq): 0.25
    H2O(aq): 0.75
  Metabolic:
    Rate:
      func: ConstantRate
      val: 3.0e-22
    Forcing:
      F_B:
        func: Bioenergetic
        xi: 0.25
        n_ATP: 0.125
        ref: JinRoden2011
      F_D:
        func: Monod
        K_s: 4.7e-06
        substrate: H2(aq)
        ref: JinRoden2011
      F_A:
        func: Monod
        K_s: 2.e-3
        substrate: HCO3-
        ref: Chen2019Frontiers

Methanogenesis_H2_CO2_sediment:
