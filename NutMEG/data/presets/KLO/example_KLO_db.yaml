FeReduction_Acetate_Fe3_sediment:
  Reactants:
    Acetate-: 1.
    Fe+3: 4.
    H2O(aq): 4.
  Products:
    HCO3-: 2.
    Fe+2: 8.
    H+: 9.
  Metabolic:
    Rate:
      func: ConstantRate
      val: 1.8e-21
    Forcing:
      F_B:
        func: Bioenergetic
        ref: Roden (2006); assuming dry mass of 1e-13 g. xi and n_ATP estimated using FeReduction_Acetate_FeOOH_sediment
        xi: 8.0
        n_ATP: 1.3
      F_A:
        K_s: 0.00025
        func: Monod
        substrate: Fe+3
        ref: JinRoden2011
      F_D:
        K_s: 1.25e-05
        ref: JinRoden2011
        func: Monod
        substrate: Acetate-


