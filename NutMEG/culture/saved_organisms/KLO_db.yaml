Methanogenesis_H2_HCO3_sediment:
  Reactants:
    H2(aq): 1.
    HCO3-: 0.25
    H+: 0.25
  Products:
    Methane(aq): 0.25
    H2O(aq): 0.75
  Acceptor: HCO3-
  Donor: H2(aq)
  Bioenergetics:
    k_max: 1.0e-06
    xi: 0.25
    n_ATP: 0.125
    ref: JinRoden2011
  F_D:
    ID: default
    K_D: 4.7e-06
    ref: JinRoden2011
  F_A:
    ID: default
    K_A: 2.e-3
  notes: F_A omitted as typical for carbonates


Methanogenesis_Acetate_sediment:
