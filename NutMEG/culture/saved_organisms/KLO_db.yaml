FeReduction_Acetate_Fe3_sediment:
  Reactants:
    Acetate-: 1.
    Fe+3: 4.
    H2O(aq): 4.
  Products:
    HCO3-: 2.
    Fe+2: 8.
    H+: 9.
  Bioenergetics:
    k_max: 6.0e-06
    ref: Roden (2006); assuming dry mass of 1e-13 g. xi and n_ATP estimated using FeReduction_Acetate_FeOOH_sediment
    xi: 8.0
    n_ATP: 1.3
  Acceptor: Fe+3
  Donor: Acetate-
  F_A:
    K_A: 0.00025
    ID: default
    ref: JinRoden2011
  F_D:
    K_D: 1.25e-05
    ref: JinRoden2011
    ID: default


